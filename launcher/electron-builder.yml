appId: de.robinschuenemann.mrlauncher
productName: MR Launch
copyright: Copyright © 2026 Robin Schünemann
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: launcher
  # Herausgeber/Beschreibung der EXE kommen aus package.json (author,
  # description) und dem copyright oben — nicht aus einem eigenen Feld hier.
  # win.publisherName gibt es seit electron-builder 26 nicht mehr; es lebt
  # jetzt unter signtoolOptions und betrifft nur die Signaturpruefung.
  # Bewusst nur noch der Installer: die portable Variante entpackt sich beim
  # Start selbst in den Temp-Ordner und führt sich von dort aus — genau das
  # Muster, das Virenscanner unabhängig vom Inhalt als typisch für Schadsoftware
  # bewerten. Der Installer installiert dagegen sichtbar und ortsfest.
  target:
    - nsis
nsis:
  # Bewusst ohne Versionsnummer im Dateinamen: dadurch funktioniert
  # https://github.com/<owner>/<repo>/releases/latest/download/MR-Launch-Setup.exe
  # als dauerhafter Link zur jeweils neuesten Version, ohne ihn je manuell
  # aktualisieren zu müssen.
  artifactName: MR-Launch-Setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  # Richtiger Installations-Assistent statt stillem Ein-Klick-Durchlauf:
  # wirkt fuer Nutzer wie fuer Windows vertrauenswuerdiger. Still installieren
  # und danach etwas starten ist eines der Verhaltensmuster, auf die Defenders
  # ML-Heuristik anspringt.
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: robinschuenemann86-collab
  repo: code-robin
